<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>.</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; background: #ffffff; color: #1a1a1a;
    }
    .container { text-align: center; padding: 24px; }
    .icon {
      width: 48px; height: 48px; border-radius: 50%;
      border: 1.5px solid #d1d5db;
      display: inline-flex; align-items: center; justify-content: center;
      margin-bottom: 20px;
    }
    .icon svg {
      width: 20px; height: 20px; stroke: #9ca3af;
      stroke-width: 1.8; fill: none;
      stroke-linecap: round; stroke-linejoin: round;
    }
    h1 {
      font-size: 20px; font-weight: 500; color: #4b5563;
      line-height: 1.4; margin-bottom: 8px;
    }
    p {
      font-size: 15px; color: #9ca3af; line-height: 1.5;
      max-width: 360px; margin: 0 auto;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0a0a0a; color: #f5f5f5; }
      h1 { color: #a1a1aa; }
      p { color: #71717a; }
      .icon { border-color: #3f3f46; }
      .icon svg { stroke: #71717a; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="7" x2="12" y2="14"/>
        <line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
    </div>
    <h1>Здесь пока ничего нет</h1>
    <p>Пожалуйста, воспользуйтесь прямой ссылкой из личных сообщений</p>
  </div>
  <script>
    (function() {
      var i = 0;
      var states = [".", "..", "...", ".."];
      setInterval(function() {
        i = (i + 1) % states.length;
        document.title = states[i];
      }, 500);
    })();
  </script>
</body>
</html>
